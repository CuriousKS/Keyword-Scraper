<!DOCTYPE html>
<html>
<head>
    <u><h1><p> RESULT OF SCRAPING </p></h1></u> <br>
    <title> RESULT OF SCRAPING </title>
</head>
<style>table,th,td{border:1px solid black;}</style>
<body>
<p>
<table style="width=50%">
    <tr>
    {% for i in L1 %}
    <b><th>{{i}}</th></b>
    {% endfor %}
    </tr>
    
    {% for i in range(a) %}
    <tr>
    {% for j in df %}
    <td>{{df[j][i]}}</td>
    {% endfor %}
    </tr>
         
    {% endfor %}
    


</table>
 
<h1> <div>
<button>Save This Data</button> </div>
</h1>

</p>
<script>
var element=document.querySelector("div")
var response
element.addEventListener('click',async function(){


                        if(element.innerText=='Save This Data'){
            
                            response=await fetch("http://localhost:8000/scraper/saveToDB",{method:"POST"})
                            // response=await response.json()
                            console.log(response.status)
                            if(response.status==204){
                            element.innerHTML="<h3>No Data To Save!</h3>"
                            }

                            if(response.status==201){
                            element.innerHTML="<h3>Your Scraped Data Have Been Saved Successfully!</h3>"
                            } 
                                                                    }  

                                                            
                            })
</script>
</body>
</html>
